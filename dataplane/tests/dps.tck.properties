# Config for the official Eclipse Dataspace TCK's `dps-tck-runtime`
# container, bind-mounted into it at /etc/tck/config.properties by
# `tests/dps_tck.rs`. See that file's module doc comment for what the
# resulting test run does and does not assert, and
# ../../ARCHITECTURE.md's "Data Plane Signaling TCK conformance" section
# for the full picture.
#
# ---- Scope, and why it's drawn here ----
#
# This data plane is PULL-only, PROVIDER-only, and implements only START
# and TERMINATE (see ../../ARCHITECTURE.md, "Signaling scope" and "What
# this MVP does not do"). The TCK's own config-driven filtering is
# test-package selection (`dataspacetck.test.package`, a JUnit
# `PackageSelector` — whole packages only, no per-class selector) plus
# JUnit tag include/exclude (`dataspacetck.filters.tags.{include,exclude}`)
# — there is no per-test-method filter. Within those limits:
#
#   - `dataspacetck.test.package` names only the plain "pull" verification
#     package (`....dataplane.pull`), not its "http.pull" sibling: that
#     package's tests (`DP_P_HTTP_PULL:*`) additionally require an HTTPS
#     endpoint and full OAuth token-renewal support (a refresh_token
#     grant flow) this MVP does not implement at all. "push" and
#     "controlplane" packages are equally out of scope, excluded simply
#     by not being named.
#   - the "async" tag is excluded: `FileOfferHandler::on_start`
#     (dataplane/src/handler.rs) always answers synchronously with
#     state=STARTED, never the 202-Accepted/STARTING + started-callback
#     shape `DP_P_PULL:04-01`/`DP_C_PULL:04-01` require.
#
# Even after that narrowing, the remaining "pull" package still contains
# the *consumer* role's tests (`DP_C_PULL:*` — this data plane only ever
# plays the provider role) and the provider's SUSPEND/RESUME tests
# (`DP_P_PULL:02-*` — SUSPEND is a deliberate MVP non-goal, see
# ../../ARCHITECTURE.md). Nothing in the TCK's own config surface can
# exclude just those, so `tests/dps_tck.rs` asserts the exact,
# already-known set of failures instead of an empty one — see that file.
#
# `datasetId`/`agreementId`/`profile` per-test overrides (the
# `DP_P_PULL_NN_NN_*`/`DP_C_PULL_NN_NN_*` keys the TCK's `@ConfigParam`
# fields read) are deliberately left unset: this data plane doesn't
# branch on `profile` at all, and `TCK_MODE` (see
# `Config::tck_mode`) makes it accept whatever random UUID `datasetId`
# the TCK mints per run, so the TCK's own random defaults for
# `datasetId`/`agreementId` and its `http-pull` default `profile` all
# work unmodified.

dataspacetck.test.package=org.eclipse.dataspacetck.dps.verification.dataplane.pull
dataspacetck.filters.tags.exclude=async

# Must match `SIGNALING_PORT` in tests/dps_tck.rs: this file is a static
# bind-mount, so it can't learn an OS-assigned ephemeral port the way
# dataplane's other integration tests (tests/signaling_flow.rs) do.
dataspacetck.dps.dataplane.url=http://host.docker.internal:19191/api/v1
